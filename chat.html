<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Esport Hire — Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container chat-container">
    <img src="esporthirelogo.png" alt="Esport Hire" class="main-logo">
    <h1>Match Chat</h1>
    <p class="tagline" id="chatSubtitle">Coordinate your match here</p>

    <div id="chatMessages" class="chat-messages"></div>

    <form id="chatForm" class="chat-form">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">➤</button>
    </form>

    <p id="chatOutput"></p>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4HrPn0JJhjX9eT0JgIc7JZ_rc2yU0uh0",
      authDomain: "esport-hire.firebaseapp.com",
      projectId: "esport-hire",
      storageBucket: "esport-hire.firebasestorage.app",
      messagingSenderId: "851326993856",
      appId: "1:851326993856:web:f5677945ef06e7e58d3425"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firestoreDB = db;
    window.firestoreCollection = collection;
    window.firestoreAddDoc = addDoc;
    window.firestoreQuery = query;
    window.firestoreOrderBy = orderBy;
    window.firestoreOnSnapshot = onSnapshot;

    window.dispatchEvent(new Event("firebaseReady"));
  </script>

  <script src="chat.js"></script>
</body>
</html>
